<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水利行业地图服务平台</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-measure/dist/leaflet-measure.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loginPage" class="login-page">
      <div class="login-card">
        <h1>水利行业地图服务平台</h1>
        <p>请输入用户名和密码登录</p>
        <input id="username" type="text" placeholder="用户名" />
        <input id="password" type="password" placeholder="密码" />
        <button id="loginBtn">登录</button>
        <p id="loginError" class="error"></p>
      </div>
    </div>

    <div id="app" class="app hidden">
      <header class="top-bar">
        <div class="brand">水利行业地图服务平台</div>
        <input id="globalSearch" type="text" placeholder="搜索行政区..." />
        <div class="user-area">
          <span id="userLabel"></span>
          <button id="logoutBtn">退出</button>
        </div>
      </header>

      <main class="main-layout">
        <aside class="left-panel" id="leftPanel">
          <div class="panel-tabs">
            <button class="tab-btn active" data-tab="layersTab">图层</button>
            <button class="tab-btn" data-tab="adminTab">行政区</button>
            <button class="tab-btn" data-tab="bookmarkTab">书签</button>
          </div>

          <section id="layersTab" class="tab-content active">
            <h3>底图</h3>
            <label><input type="radio" name="basemap" value="vec" checked /> 矢量底图</label>
            <label><input type="radio" name="basemap" value="img" /> 影像底图</label>

            <h3>专题图层</h3>
            <div id="overlayList"></div>
          </section>

          <section id="adminTab" class="tab-content">
            <input id="adminSearch" type="text" placeholder="过滤行政区..." />
            <ul id="adminList" class="list"></ul>
          </section>

          <section id="bookmarkTab" class="tab-content">
            <div class="bookmark-actions">
              <input id="bookmarkName" type="text" placeholder="书签名称" />
              <button id="saveBookmarkBtn">保存当前视图</button>
            </div>
            <ul id="bookmarkList" class="list"></ul>
          </section>
        </aside>

        <section class="map-area">
          <div id="map"></div>
          <div id="splitContainer" class="hidden">
            <div id="mapLeft"></div>
            <div id="mapRight"></div>
          </div>

          <div class="toolbar">
            <button data-tool="home">回到初始</button>
            <button data-tool="locate">坐标定位</button>
            <button data-tool="query">空间查询(矩形)</button>
            <button data-tool="screenshot">截图导出</button>
            <button data-tool="split">两屏对比</button>
            <button data-tool="swipe">卷帘对比</button>
            <button data-tool="exitCompare">退出对比</button>
          </div>
        </section>
      </main>

      <footer class="status-bar">
        <span id="mouseCoord">坐标: --</span>
        <span id="scaleInfo">比例尺已启用</span>
      </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet-measure/dist/leaflet-measure.js"></script>
    <script src="https://unpkg.com/leaflet-side-by-side@2.2.0/leaflet-side-by-side.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
